<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>旅のしおり</title>

<script>
/* ==========================================================
   ここだけ編集すれば、旅が増えます。
   旅を1つ足すときは、{ } のかたまりを1行コピーして書き換える。
   新しい旅ほど上に書いてください。

   id     … フォルダ名。そのままリンク先になる（末尾に / は不要）
   title  … 旅の名前
   place  … 地域名
   date   … 年.月まで。日付は書かない（留守が特定されるため）
   status … "予定" か "記録"。空にすると何も出ません
   ========================================================== */

const TRIPS = [
  {
    id:     "2026-09-beppu",
    title:  "別府・ハーモニーランド",
    place:  "大分",
    date:   "2026.09",
    status: "予定"
  },

  /* --- 次の旅は、この下にコピーして足す ---
  {
    id:     "2026-11-aso",
    title:  "阿蘇",
    place:  "熊本",
    date:   "2026.11",
    status: "予定"
  },
  --- ここまで --- */
];
</script>

<style>
  :root{
    --paper:      #EFEDE6;
    --card:       #F8F6F1;
    --sumi:       #23262B;
    --ai:         #2B4A66;
    --ai-pale:    #8CA3B5;
    --yamabuki:   #B0812C;
    --rule:       #D6D2C7;

    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS PMincho", serif;
    --gothic: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--sumi);
    font-family: var(--gothic);
    line-height: 1.7;
    padding: 0 20px 64px;
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
  }

  /* ---------- 見出し ---------- */
  header{
    padding: 64px 0 28px;
  }

  h1{
    font-family: var(--mincho);
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    margin: 0;
    color: var(--ai);
  }

  .rule{
    height: 1px;
    background: var(--ai);
    margin-top: 20px;
    opacity: 0.55;
  }

  /* ---------- 旅の一覧 ---------- */
  .list{
    margin-top: 4px;
  }

  .trip{
    display: grid;
    grid-template-columns: 62px 1px 1fr auto;
    align-items: center;
    gap: 0 18px;
    padding: 22px 4px;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    transition: background-color 0.15s ease;
  }

  .trip:active{ background: var(--card); }

  @media (hover: hover){
    .trip:hover{ background: var(--card); }
  }

  .trip:focus-visible{
    outline: 2px solid var(--ai);
    outline-offset: 2px;
  }

  /* 日付：年を小さく、月を大きく縦に積む */
  .when{
    text-align: right;
    font-family: var(--mincho);
    line-height: 1.1;
  }
  .when .y{
    display: block;
    font-family: var(--gothic);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ai-pale);
  }
  .when .m{
    display: block;
    font-size: 27px;
    color: var(--ai);
    margin-top: 3px;
  }

  .divider{
    align-self: stretch;
    background: var(--rule);
  }

  .about .title{
    font-family: var(--mincho);
    font-size: 19px;
    line-height: 1.45;
    color: var(--sumi);
  }
  .about .place{
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ai-pale);
    margin-top: 4px;
  }

  .status{
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--yamabuki);
    border: 1px solid var(--yamabuki);
    border-radius: 2px;
    padding: 3px 7px;
    white-space: nowrap;
    opacity: 0.9;
  }
  .status[data-kind="記録"]{
    color: var(--ai-pale);
    border-color: var(--ai-pale);
  }

  /* ---------- 旅がないとき ---------- */
  .empty{
    font-family: var(--mincho);
    color: var(--ai-pale);
    padding: 56px 0;
    text-align: center;
    line-height: 2;
  }

  footer{
    margin-top: 40px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ai-pale);
  }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>旅のしおり</h1>
    <div class="rule"></div>
  </header>

  <main class="list" id="list"></main>

  <footer>個人的な記録です</footer>

</div>

<script>
(function () {
  const list = document.getElementById("list");

  if (!Array.isArray(TRIPS) || TRIPS.length === 0) {
    list.innerHTML =
      '<p class="empty">まだ旅がありません。<br>最初のしおりを追加してください。</p>';
    return;
  }

  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

  const html = TRIPS.map((t) => {
    const parts = String(t.date || "").split(".");
    const year  = parts[0] || "";
    const month = parts[1] || "";
    const tag = t.status
      ? '<span class="status" data-kind="' + esc(t.status) + '">' + esc(t.status) + "</span>"
      : "<span></span>";

    return (
      '<a class="trip" href="' + esc(t.id) + '/">' +
        '<span class="when">' +
          '<span class="y">' + esc(year) + "</span>" +
          '<span class="m">' + esc(month) + "</span>" +
        "</span>" +
        '<span class="divider"></span>' +
        '<span class="about">' +
          '<span class="title">' + esc(t.title) + "</span>" +
          '<span class="place">' + esc(t.place) + "</span>" +
        "</span>" +
        tag +
      "</a>"
    );
  }).join("");

  list.innerHTML = html;
})();
</script>
</body>
</html>
